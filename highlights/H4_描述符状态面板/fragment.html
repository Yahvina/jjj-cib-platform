<!-- H4 ｜ 描述符状态面板（区间／依据／已知值） ｜ 摘自 _src/v15/index.html 第 179–211 行 -->
<section class="pane" id="p2">
  <h2 class="pt tip wide" tabindex="0" data-tip="每个描述符只取一个状态。状态区间的数值把「高速」这类标签落到具体范围，标签因此成为半定量档位。">选择描述符与状态</h2>

  <div class="grid2">
    <div>
      <div class="tools">
        <input class="txt" id="search" placeholder="搜索描述符或对应变量…" oninput="onSearch()">
        <button class="btn sm" onclick="setSearch('')">清除</button>
      </div>
      <div style="font-size:13px;color:var(--tx2);margin-bottom:8px;">
        <span class="tip quiet wide" tabindex="0" data-tip="结果型由模型算出、不能勾选，节点内已标注「不可作为输入」。">描述符树</span>　<span id="treeCnt">共 19 个 · 已选 0 项</span></div>
      <div class="tree" id="tree"></div>
    </div>
    <div>
      <div style="font-size:13px;color:var(--tx2);margin-bottom:8px;">
        <span class="tip quiet wide" tabindex="0" data-tip="含取值区间，可编辑。勾选的档位就是这个描述符的可信范围——一致性检验只在这个范围里找自洽情景，一个都不勾＝不设限（全部档位都参与）。要排除与已知值不相容的档位，用每个描述符下方的已知值。">状态设置</span></div>
      <div class="scopebar">
        <span class="slb">区间视角</span>
        <span class="scopebtns" id="scopeBtns"></span>
        <span class="tip snote-h" tabindex="0" data-tip="同一描述符在不同辖区可以有不同档位边界：北京三产 86% 与河北 55%，用一套区间就会错位。">?</span>
      </div>
      <div id="statePanel"><div class="empty">左侧勾选描述符后，这里显示它的状态选项</div></div>
      <div id="outPanel"></div>
    </div>
  </div>

  <div class="card">
    <h3>描述符框架</h3>
    <details class="fold"><summary>为什么换一套行业也能跑</summary><div class="foldbody">这套算法不认「京津冀」——它只认一组描述符、每档区间、两两判断。所以描述符集可以整体导出/导入：
      换一套行业或区域，同一套流程照跑。落地靠本地数据，通用性就靠这一层。</div></details>
    <div id="fwBox"></div>
  </div>
</section>
